# Perfil de candidato — editá este archivo con tu información real
# El agente lo usa para comparar cada oferta y calcular el fit score (0-100)

name: "Tu Nombre"
current_title: "Senior Software Engineer"
years_of_experience: 6

# Tecnologías ordenadas por dominio: expert > proficient > familiar
skills:
  expert:
    - Python
    - FastAPI
    - PostgreSQL
    - Docker
  proficient:
    - TypeScript
    - React
    - AWS (EC2, S3, Lambda)
    - Kubernetes
  familiar:
    - Go
    - Terraform
    - Redis

# Industrias preferidas (de mayor a menor preferencia)
preferred_industries:
  - Fintech
  - B2B SaaS
  - Developer tools
  - AI / ML

# Tipos de rol buscados
target_roles:
  - Backend Engineer
  - Full-Stack Engineer
  - Staff Engineer
  - Engineering Lead

# Modalidad de trabajo
work_mode:
  remote: true         # acepta remoto
  hybrid: true         # acepta híbrido
  on_site: false       # no acepta 100% presencial

# Ubicación (para roles presenciales / híbridos)
location:
  city: "Buenos Aires"
  country: "Argentina"
  willing_to_relocate: false

# Compensación esperada (en USD anuales, para empresas internacionales)
compensation:
  min_usd_annual: 60000
  preferred_usd_annual: 90000
  # Si la oferta es en ARS, el agente la descarta automáticamente si está marcada como local_only
  accepts_local_ars: false

# Cosas que el agente debe penalizar fuerte en el score
dealbreakers:
  - "Sin experiencia en startups"
  - "Solo .NET / Java enterprise"
  - "Requiere visa / trabajo en el exterior"
  - "Salario no competitivo o no especificado para rol senior"

# Cosas que suman puntos extra
boosters:
  - Equity / stock options
  - Trabajo 100% remoto con equipo internacional
  - Empresa con producto propio (no consultora)
  - Stack moderno (Python, TypeScript, Go, Rust)
  - Cultura de ingeniería fuerte (blog técnico, open source)

# Nota libre que se pasa al LLM como contexto adicional
additional_context: |
  Busco un rol donde pueda crecer hacia Staff / Principal Engineer.
  Prefiero equipos pequeños (< 50 personas de ingeniería) con autonomía real.
  No me interesan roles puramente de mantenimiento; quiero diseñar sistemas.
